
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAND Tricker APK - AI Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
        color: #ffffff;
        overflow-x: hidden;
        line-height: 1.6;
        min-height: 100vh;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* Header Section */
    .header-section {
        padding: 40px 0;
        text-align: center;
        position: relative;
        background: radial-gradient(circle at center, rgba(255,215,0,0.08), transparent);
    }

    .logo-glow {
        width: 80px;
        height: 80px;
        background: linear-gradient(45deg, #ffd700, #ff6b35);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .logo-image {
        width: 60px;
        height: 60px;
        border-radius: 15px;
        object-fit: cover;
    }

    .header-title {
        font-size: 2.5rem;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #ffd700, #ff6b35, #4ecdc4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .header-subtitle {
        font-size: 1.2rem;
        opacity: 0.8;
        margin-bottom: 20px;
    }

    /* Navigation Buttons */
    .nav-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 40px 0;
        flex-wrap: wrap;
    }

    .nav-btn {
        background: linear-gradient(45deg, #ffd700, #ff6b35);
        color: #000;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        min-width: 150px;
    }

    .nav-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
    }

    .nav-btn.active {
        background: linear-gradient(45deg, #4ecdc4, #45b7aa);
        color: #fff;
        box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
    }

    .nav-btn i {
        margin-right: 8px;
    }

    /* Function Sections */
    .function-section {
        display: none;
        background: linear-gradient(145deg, rgba(255,215,0,0.1), rgba(255,107,53,0.1));
        border: 2px solid rgba(255,215,0,0.3);
        border-radius: 20px;
        padding: 40px;
        margin: 20px 0;
        backdrop-filter: blur(5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        animation: fadeIn 0.5s ease-out;
    }

    .function-section.active {
        display: block;
    }

    .section-title {
        font-size: 2rem;
        margin-bottom: 20px;
        text-align: center;
        background: linear-gradient(45deg, #ffd700, #4ecdc4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .section-description {
        text-align: center;
        opacity: 0.8;
        margin-bottom: 30px;
        font-size: 1.1rem;
    }

    /* Input Forms */
    .input-group {
        margin-bottom: 20px;
    }

    .input-label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #ffd700;
    }

    .input-field {
        width: 100%;
        padding: 15px;
        border: 2px solid rgba(255,215,0,0.3);
        border-radius: 10px;
        background: rgba(255,255,255,0.1);
        color: #fff;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }

    .input-field:focus {
        outline: none;
        border-color: #ffd700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .input-field::placeholder {
        color: rgba(255,255,255,0.5);
    }

    .textarea-field {
        min-height: 80px;
        resize: vertical;
    }

    .submit-btn {
        background: linear-gradient(45deg, #4ecdc4, #45b7aa);
        color: #fff;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        width: 100%;
        max-width: 200px;
        margin: 20px auto 0;
        display: block;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
    }

    .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    /* Response Area */
    .response-area {
        margin-top: 30px;
        padding: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 15px;
        border: 1px solid rgba(255,215,0,0.2);
        display: none;
    }

    .response-area.show {
        display: block;
        animation: slideDown 0.3s ease-out;
    }

    .response-title {
        font-size: 1.2rem;
        color: #ffd700;
        margin-bottom: 10px;
    }

    .response-content {
        color: #4ecdc4;
        font-size: 1.1rem;
        line-height: 1.6;
    }

    .loading {
        text-align: center;
        color: #ffd700;
    }

    .loading i {
        animation: spin 1s linear infinite;
    }

    /* Back to Home Button */
    .back-home {
        position: fixed;
        top: 20px;
        left: 20px;
        background: linear-gradient(45deg, #ffd700, #ff6b35);
        color: #000;
        padding: 10px 15px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        transition: all 0.3s ease;
        z-index: 100;
    }

    .back-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
        .header-title { font-size: 2rem; }
        .header-subtitle { font-size: 1rem; }
        .nav-buttons { flex-direction: column; align-items: center; }
        .nav-btn { min-width: 200px; }
        .function-section { padding: 25px 20px; }
        .back-home { 
            position: relative; 
            top: auto; 
            left: auto; 
            margin: 20px auto;
            display: block;
            text-align: center;
            width: fit-content;
        }
    }

    @media (max-width: 480px) {
        .header-title { font-size: 1.6rem; }
        .function-section { padding: 20px 15px; }
        .nav-btn { padding: 12px 25px; font-size: 1rem; }
    }
</style>
<body>
    <!-- Back to Home -->
    <a href="/visit.html" class="back-home">
        <i class="fas fa-home"></i> Home
    </a>

    <!-- Header Section -->
    <header class="header-section">
        <div class="container">
            <div class="logo-glow">
                <img src="https://i.ibb.co/xKFdQMVh/icon.png" alt="Chand Tricker APK Logo" class="logo-image">
            </div>
            <h1 class="header-title">CHAND AI CHAT</h1>
            <p class="header-subtitle">Ask questions or teach new responses</p>
        </div>
    </header>

    <!-- Navigation Buttons -->
    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn" id="askBtn">
                <i class="fas fa-question-circle"></i> Ask Question
            </button>
            <button class="nav-btn" id="teachBtn">
                <i class="fas fa-graduation-cap"></i> Teach Response
            </button>
        </div>

        <!-- Ask Section -->
        <div class="function-section" id="askSection">
            <h2 class="section-title">
                <i class="fas fa-question-circle"></i> Ask a Question
            </h2>
            <p class="section-description">
                Ask me anything! I'll try my best to give you a helpful answer.
            </p>
            <div class="input-group">
                <label class="input-label" for="askInput">Your Question:</label>
                <input type="text" id="askInput" class="input-field" placeholder="Type your question here..." maxlength="500">
            </div>
            <button class="submit-btn" id="askSubmit">
                <i class="fas fa-paper-plane"></i> Ask
            </button>
            <div class="response-area" id="askResponse">
                <div class="response-title">Response:</div>
                <div class="response-content" id="askResponseContent"></div>
            </div>
        </div>

        <!-- Teach Section -->
        <div class="function-section" id="teachSection">
            <h2 class="section-title">
                <i class="fas fa-graduation-cap"></i> Teach New Response
            </h2>
            <p class="section-description">
                Help me learn! Teach me how to respond to specific questions.
            </p>
            <div class="input-group">
                <label class="input-label" for="teachQuestion">Question:</label>
                <input type="text" id="teachQuestion" class="input-field" placeholder="What question should I learn?" maxlength="300">
            </div>
            <div class="input-group">
                <label class="input-label" for="teachAnswer">Answer:</label>
                <textarea id="teachAnswer" class="input-field textarea-field" placeholder="How should I respond to this question?" maxlength="1000"></textarea>
            </div>
            <button class="submit-btn" id="teachSubmit">
                <i class="fas fa-brain"></i> Teach
            </button>
            <div class="response-area" id="teachResponse">
                <div class="response-title">Learning Status:</div>
                <div class="response-content" id="teachResponseContent"></div>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const askBtn = document.getElementById('askBtn');
        const teachBtn = document.getElementById('teachBtn');
        const askSection = document.getElementById('askSection');
        const teachSection = document.getElementById('teachSection');
        const askInput = document.getElementById('askInput');
        const askSubmit = document.getElementById('askSubmit');
        const askResponse = document.getElementById('askResponse');
        const askResponseContent = document.getElementById('askResponseContent');
        const teachQuestion = document.getElementById('teachQuestion');
        const teachAnswer = document.getElementById('teachAnswer');
        const teachSubmit = document.getElementById('teachSubmit');
        const teachResponse = document.getElementById('teachResponse');
        const teachResponseContent = document.getElementById('teachResponseContent');

        // Navigation functionality
        askBtn.addEventListener('click', () => {
            showSection('ask');
        });

        teachBtn.addEventListener('click', () => {
            showSection('teach');
        });

        function showSection(section) {
            // Hide all sections
            askSection.classList.remove('active');
            teachSection.classList.remove('active');
            askResponse.classList.remove('show');
            teachResponse.classList.remove('show');

            // Remove active class from all buttons
            askBtn.classList.remove('active');
            teachBtn.classList.remove('active');

            // Show selected section
            if (section === 'ask') {
                askSection.classList.add('active');
                askBtn.classList.add('active');
                askInput.focus();
            } else if (section === 'teach') {
                teachSection.classList.add('active');
                teachBtn.classList.add('active');
                teachQuestion.focus();
            }
        }

        // Ask functionality
        askSubmit.addEventListener('click', async () => {
            const question = askInput.value.trim();
            if (!question) {
                showResponse('ask', 'Please enter a question!', false);
                return;
            }

            askSubmit.disabled = true;
            askSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Asking...';

            showResponse('ask', '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Thinking...</div>', true);

            try {
                const response = await fetch(`/sim?ask=${encodeURIComponent(question)}`);
                const data = await response.json();

                if (data.error) {
                    showResponse('ask', `Error: ${data.error}`, false);
                } else {
                    showResponse('ask', data.respond || 'No response received.', true);
                }
            } catch (error) {
                showResponse('ask', 'Sorry, I encountered an error while processing your question. Please try again.', false);
            } finally {
                askSubmit.disabled = false;
                askSubmit.innerHTML = '<i class="fas fa-paper-plane"></i> Ask';
            }
        });

        // Teach functionality
        teachSubmit.addEventListener('click', async () => {
            const question = teachQuestion.value.trim();
            const answer = teachAnswer.value.trim();

            if (!question || !answer) {
                showResponse('teach', 'Please fill in both question and answer fields!', false);
                return;
            }

            teachSubmit.disabled = true;
            teachSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Teaching...';

            showResponse('teach', '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Learning...</div>', true);

            try {
                const response = await fetch(`/teach?ask=${encodeURIComponent(question)}&ans=${encodeURIComponent(answer)}`);
                const data = await response.json();

                if (data.error) {
                    showResponse('teach', `Error: ${data.error}`, false);
                } else {
                    showResponse('teach', `✅ Successfully learned! I now know how to respond to: "${data.ask}"`, true);
                    teachQuestion.value = '';
                    teachAnswer.value = '';
                }
            } catch (error) {
                showResponse('teach', 'Sorry, I encountered an error while learning. Please try again.', false);
            } finally {
                teachSubmit.disabled = false;
                teachSubmit.innerHTML = '<i class="fas fa-brain"></i> Teach';
            }
        });

        // Response display function
        function showResponse(type, message, isSuccess) {
            const responseArea = type === 'ask' ? askResponse : teachResponse;
            const responseContent = type === 'ask' ? askResponseContent : teachResponseContent;

            responseContent.innerHTML = message;
            responseContent.style.color = isSuccess ? '#4ecdc4' : '#ff6b6b';
            responseArea.classList.add('show');
        }

        // Enter key support
        askInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !askSubmit.disabled) {
                askSubmit.click();
            }
        });

        teachAnswer.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey && !teachSubmit.disabled) {
                teachSubmit.click();
            }
        });

        // Initialize - show Ask section by default
        document.addEventListener('DOMContentLoaded', () => {
            showSection('ask');
        });

        // Auto-hide responses when switching sections
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('nav-btn')) {
                setTimeout(() => {
                    askResponse.classList.remove('show');
                    teachResponse.classList.remove('show');
                }, 100);
            }
        });
    </script>
</body>
</html>
