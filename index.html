
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAND TRICKER APK - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta http-equiv="refresh" content="0; url=./public/visit.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .loading-container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .logo-glow {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #ffd700, #ff6b35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .logo-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
        }

        .loading-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ffd700, #ff6b35, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-text {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s ease-in-out infinite;
        }

        .redirect-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: linear-gradient(45deg, #4ecdc4, #45b7aa);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }

        .redirect-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .loading-title { font-size: 2rem; }
            .loading-text { font-size: 1rem; }
            .logo-glow {
                width: 100px;
                height: 100px;
            }
            .logo-image {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo-glow">
            <img src="https://i.ibb.co/xKFdQMVh/icon.png" alt="Chand Tricker APK Logo" class="logo-image">
        </div>
        <h1 class="loading-title">CHAND TRICKER APK</h1>
        <p class="loading-text">Loading your experience...</p>
        <div class="spinner"></div>
        <div style="margin-top: 30px;">
            <a href="./public/visit.html" class="redirect-link">
                <i class="fas fa-arrow-right"></i> Enter Site
            </a>
        </div>
    </div>

    <script>
        // Automatic redirect after 2 seconds
        setTimeout(() => {
            window.location.href = './public/visit.html';
        }, 2000);

        // Preload the visit page for faster transition
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = './public/visit.html';
        document.head.appendChild(link);
    </script>
</body>
</html>
